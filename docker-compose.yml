version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: aqi_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aqi_analysis
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    restart: always

  app:
    build: .
    container_name: aqi_pipeline_app
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=aqi_analysis
    volumes:
      - .:/app

volumes:
  mysql_data: